# Sobe tudo com:  docker compose up --build   →  http://localhost:8081
# Os valores padrão abaixo servem só para demonstração local. Em produção, defina um .env
# (veja .env.example), principalmente PELOMACIO_JWT_SECRET, DB_PASSWORD e PELOMACIO_DEMO=false.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pelo_macio
      POSTGRES_USER: ${DB_USER:-pelomacio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pelomacio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pelomacio} -d pelo_macio"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/pelo_macio
      DB_USER: ${DB_USER:-pelomacio}
      DB_PASSWORD: ${DB_PASSWORD:-pelomacio}
      PELOMACIO_JWT_SECRET: ${PELOMACIO_JWT_SECRET:-somente-para-demo-local-troque-em-producao-0123456789}
      PELOMACIO_CORS_ORIGINS: ${PELOMACIO_CORS_ORIGINS:-http://localhost:8081}
      PELOMACIO_TOKEN_KEY: ${PELOMACIO_TOKEN_KEY:-}
      PELOMACIO_FRONTEND_URL: ${PELOMACIO_FRONTEND_URL:-http://localhost:8081}
      PELOMACIO_TIMEZONE: ${PELOMACIO_TIMEZONE:-America/Sao_Paulo}
      # Duas lojas de exemplo (demo@pelomacio.app e patas@pelomacio.app, senha demo1234)
      PELOMACIO_DEMO: ${PELOMACIO_DEMO:-true}
      PELOMACIO_DEMO_SENHA: ${PELOMACIO_DEMO_SENHA:-demo1234}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/api/google/callback}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
