spring.application.name=pelo-macio
server.port=8080

# Banco de dados (sobrescreva por variaveis de ambiente em producao)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pelo_macio}
spring.datasource.username=${DB_USER:pelomacio}
spring.datasource.password=${DB_PASSWORD:pelomacio}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
pelomacio.jwt.secret=${PELOMACIO_JWT_SECRET:SuaChaveSecretaMuitoLongaParaJWTComPeloMenos256BitsDeComprimento!}
pelomacio.jwt.expiration=86400000

# CORS (frontend Angular)
pelomacio.cors.allowed-origins=${PELOMACIO_CORS_ORIGINS:http://localhost:4200}

# Dados de demonstracao (duas lojas de exemplo). Desligado por padrao; o docker-compose liga.
pelomacio.demo.enabled=${PELOMACIO_DEMO:false}
pelomacio.demo.senha=${PELOMACIO_DEMO_SENHA:demo1234}

# Google Calendar (OAuth2 por profissional). Sem GOOGLE_CLIENT_ID/SECRET a integracao fica desligada.
# redirect-uri: URL PUBLICA do callback, exatamente como cadastrada no Google Cloud Console.
# Passa pelo mesmo host do frontend (proxy /api): dev http://localhost:4200, docker http://localhost:8081.
pelomacio.google.client-id=${GOOGLE_CLIENT_ID:}
pelomacio.google.client-secret=${GOOGLE_CLIENT_SECRET:}
pelomacio.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:4200/api/google/callback}

# Para onde o navegador volta depois do consentimento no Google
pelomacio.frontend.url=${PELOMACIO_FRONTEND_URL:http://localhost:4200}

# Fuso do pet shop: usado nos horarios dos eventos do Google
pelomacio.timezone=${PELOMACIO_TIMEZONE:America/Sao_Paulo}

# Chave para cifrar os refresh tokens do Google no banco (por padrao, derivada do segredo JWT).
# Defina PELOMACIO_TOKEN_KEY para poder trocar o segredo JWT sem desconectar os profissionais.
pelomacio.security.token-key=${PELOMACIO_TOKEN_KEY:}

# WhatsApp Cloud API
pelomacio.whatsapp.api-url=https://graph.facebook.com/v18.0
pelomacio.whatsapp.token=${WHATSAPP_TOKEN:SEU_TOKEN}
pelomacio.whatsapp.phone-number-id=${WHATSAPP_PHONE_ID:SEU_PHONE_NUMBER_ID}

# Lembretes (todo dia as 08:00)
pelomacio.scheduler.lembrete-cron=0 0 8 * * ?
