# Testes de integração usam um PostgreSQL real (a exclusion constraint e as FKs compostas dependem dele).
# Local:  docker run -d --name pelomacio-test-db -p 5433:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pelo_macio_test postgres:16-alpine
# CI:     o workflow sobe um service container e define TEST_DB_URL.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/pelo_macio_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
pelomacio.jwt.secret=segredo-so-para-testes-com-mais-de-32-bytes-ok-ok
pelomacio.demo.enabled=false
pelomacio.scheduler.lembrete-cron=-
