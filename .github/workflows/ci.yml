name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pelo_macio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Os testes de integração (isolamento entre lojas, constraints do banco) rodam neste PostgreSQL.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/pelo_macio_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx ng build --configuration production
        working-directory: frontend

  stack:
    name: Docker Compose (sobe tudo e testa a página pública)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o sistema
        run: docker compose up -d --build
      - name: Espera a API responder pelo nginx e confere a página pública da loja de demonstração
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/api/publico/lojas/demo | grep -q '"slug":"demo"'; then
              echo "API no ar"; break
            fi
            sleep 3
            [ "$i" = 60 ] && { docker compose logs backend; exit 1; }
          done
          curl -fsS http://localhost:8081/api/publico/lojas/demo/servicos | grep -q 'Banho'
          # a SPA responde nas rotas do Angular
          curl -fsS http://localhost:8081/agendar/demo | grep -q '<app-root'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
