server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API no mesmo domínio: o navegador chama /api e o nginx repassa ao backend (sem CORS)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # IP real do cliente (sobrescreve qualquer valor enviado por ele): usado no limite de requisições
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota do Angular cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
